name: CI

# Build the host test and run it on every push and pull request. Warnings are
# treated as errors (-Werror) so the build stays clean.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware test
        run: |
          g++ -std=c++17 -I src \
              src/SolarModel.cpp src/SolarFit.cpp src/DriftClock.cpp \
              test/test_fit.cpp -o test_fit \
              -Wall -Wextra -Werror

      - name: Run firmware test
        run: ./test_fit

      - name: Build simulator + engine test
        run: |
          g++ -std=c++17 -O2 -I src -I sim \
              src/SolarModel.cpp src/SolarFit.cpp src/DriftClock.cpp \
              sim/World.cpp sim/Deployment.cpp sim/Engine.cpp sim/sim.cpp \
              -o sim_run -Wall -Wextra -Werror
          g++ -std=c++17 -O2 -I src -I sim \
              src/SolarModel.cpp src/SolarFit.cpp src/DriftClock.cpp \
              sim/World.cpp sim/Deployment.cpp sim/Engine.cpp \
              test/test_sim.cpp -o test_sim -Wall -Wextra -Werror

      - name: Run engine test
        run: ./test_sim
