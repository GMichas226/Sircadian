name=Sircadian
version=1.0.0
author=Georgios Michalopoulos
maintainer=Georgios Michalopoulos
sentence=RTC-less, network-less wall clock disciplined by daylight.
paragraph=Keeps wall time on a bare MCU by fitting a photoresistor's daily light curve against the astronomical clear-sky curve for the site, learning oscillator drift (ppm) from the offset. Optional light-sensor temperature correction undoes the photoresistor's thermal gain drift given a bench-calibrated tempco and an ambient temperature sensor. Seed the epoch once (serial, button, one-off NTP); the clock then free-runs on light alone. Needs ~3 KB RAM for the daily light buffer.
category=Timing
